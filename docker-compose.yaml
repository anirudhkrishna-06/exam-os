
services:
  postgres:
    image: postgres:17
    container_name: exam-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: exam_os
      POSTGRES_USER: exam_user
      POSTGRES_PASSWORD: exam_dev_password
    ports:
      - "5432:5432"
    volumes:
      - exam_os_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam_user -d exam_os"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  exam_os_pgdata:
